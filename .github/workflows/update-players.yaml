name: Daily players.json update

permissions:
  contents: write

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the :00 mark to dodge GitHub's cron congestion
  workflow_dispatch: # allows manual trigger

concurrency:
  group: update-players
  cancel-in-progress: false

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest players.json
        run: node scripts/fetch-players.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          if git diff --cached --quiet; then
            echo "No changes in players.json"
            exit 0
          fi
          git commit -m "chore: daily update of players.json"
          git push
